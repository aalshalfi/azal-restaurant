name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in script.js auth.js supabase-config.js reservation-config.js admin.js admin-team.js role-door.js staff.js; do if [ -f "$f" ]; then node --check "$f"; fi; done
      - name: Runtime smoke test (language switch, menu, cart)
        run: node --test tests/*.test.mjs
      - name: Check all page markup and bilingual menu/account hooks
        run: |
          python - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path

          class MarkupAudit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if "id" in values:
                      self.ids.append(values["id"])

          pages = ("index.html", "menu.html", "story.html", "member.html")
          for page_name in pages:
              html = Path(page_name).read_text(encoding="utf-8")
              parser = MarkupAudit()
              parser.feed(html)
              duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
              if duplicates:
                  raise SystemExit(f"{page_name}: duplicate HTML ids: {duplicates}")
              for token in ('id="languageToggle"', 'id="cartOpen"', 'id="cartDrawer"', 'href="member.html"'):
                  if token not in html:
                      raise SystemExit(f"{page_name}: missing shared site hook: {token}")

          menu = Path("menu.html").read_text(encoding="utf-8")
          required_menu = (
              'id="sufraCompass"',
              'id="sufraStatus"',
              'data-sufra-category="Traditional"',
              'data-sufra-category="Rice"',
              'data-sufra-category="Sides"',
              'data-i18n-aria-label="sufraGroup"',
          )
          for token in required_menu:
              if token not in menu:
                  raise SystemExit(f"Missing Menu Sufra hook: {token}")

          member = Path("member.html").read_text(encoding="utf-8")
          # Owner 21:30/21:31: before sign-ups open the page shows one honest state, no points/membership shells, no dead buttons.
          if 'data-i18n="memberSoonTitle"' not in member:
              raise SystemExit("Missing the member page's pre-launch state: memberSoonTitle")
          main = member[member.index("<main"):member.index("</main>")]
          for token in ('data-i18n="memberStatusValue"', 'data-i18n="memberPointsValue"', ' disabled'):
              if token in main:
                  raise SystemExit(f"Member page body must not render a placeholder or dead control: {token}")
          if "<form" in member or "<input" in member:
              raise SystemExit("Member preview must not collect credentials or personal data")

          js = Path("script.js").read_text(encoding="utf-8")
          required_translations = (
              "sufraKicker:", "sufraWarm:", "sufraRice:", "sufraSides:",
              "sufraStatusInitial:", "sufraStatusTraditional:",
              "sufraStatusRice:", "sufraStatusSides:", "navMajlis:",
              "memberStatusValue:", "memberPointsValue:", "memberSignIn:", "memberJoin:",
          )
          for token in required_translations:
              if js.count(token) < 2:
                  raise SystemExit(f"Expected EN and FR translations for {token}")

          print("Four page IDs, shared navigation, Sufra controls, and bilingual member hooks passed.")
          PY

  # Lead 22:05 (ChatGPT finding on #45): the tests/*.browser.mjs suites ran nowhere in CI, so browser evidence was only
  # ever self-reported. This job runs every one of them on each push/PR, headless Chromium, nothing deployed.
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright (Chromium only; not committed, no package.json)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run every browser suite
        run: |
          set -e
          for f in tests/*.browser.mjs; do echo "::group::$f"; node "$f"; echo "::endgroup::"; done

  # T-08 database proof: two isolated PostgreSQL 16 databases, no staging credentials.
  sql-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
      - name: Run points redemption behaviour on a fresh PostgreSQL 16 database
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          createdb -h 127.0.0.1 -U postgres azal_points_review
          DB='postgresql://postgres:postgres@127.0.0.1:5432/azal_points_review'
          psql "$DB" -X -v ON_ERROR_STOP=1 -f tests/sql/supabase-stub.sql
          psql "$DB" -X -v ON_ERROR_STOP=1 -f docs/schema-reference/0001_azal_staging_baseline.sql
          for migration in 0002_p2_fixes.sql 0003_membership_provisioning.sql 0004_ordering_functions.sql 0006_points_redeem.sql 0007_points_increments.sql; do
            psql "$DB" -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done
          DATABASE_URL="$DB" bash tests/sql/run-one.sh tests/sql/points-redeem-behaviour.sql
      - name: Run T-08 admin directory behaviour on a fresh PostgreSQL 16 database
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          createdb -h 127.0.0.1 -U postgres azal_admin_review
          DB='postgresql://postgres:postgres@127.0.0.1:5432/azal_admin_review'
          psql "$DB" -X -v ON_ERROR_STOP=1 -f tests/sql/supabase-stub.sql
          psql "$DB" -X -v ON_ERROR_STOP=1 -f docs/schema-reference/0001_azal_staging_baseline.sql
          for migration in 0002_p2_fixes.sql 0003_membership_provisioning.sql 0004_ordering_functions.sql 0006_points_redeem.sql 0007_points_increments.sql 0008_profile_contact.sql 0009_order_notifications.sql 0010_order_contact_phone.sql 0013_member_number.sql 0014_admin_customer_directory.sql; do
            psql "$DB" -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done
          DATABASE_URL="$DB" bash tests/sql/run-one.sh tests/sql/admin-directory-behaviour.sql
      - name: Run T-14 team access and A1/A2 behavior on a fresh PostgreSQL 16 database
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          createdb -h 127.0.0.1 -U postgres azal_admin_team_review
          DB='postgresql://postgres:postgres@127.0.0.1:5432/azal_admin_team_review'
          psql "$DB" -X -v ON_ERROR_STOP=1 -f tests/sql/supabase-stub.sql
          psql "$DB" -X -v ON_ERROR_STOP=1 -f docs/schema-reference/0001_azal_staging_baseline.sql
          for migration in 0002_p2_fixes.sql 0003_membership_provisioning.sql 0004_ordering_functions.sql 0006_points_redeem.sql 0007_points_increments.sql 0008_profile_contact.sql 0009_order_notifications.sql 0010_order_contact_phone.sql 0013_member_number.sql 0014_admin_customer_directory.sql 0016_admin_team_access.sql; do
            psql "$DB" -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done
          DATABASE_URL="$DB" bash tests/sql/run-one.sh tests/sql/admin-team-access-behaviour.sql

  edge-function-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check T-14 Admin Edge Function
        run: deno check supabase/functions/admin-team-access/index.ts
